<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tea Time Cafe — Staff Dashboard</title>
  <style>
    :root {
      --color-primary: #8a6fc4;
      --color-primary-dark: #7559ad;
      --color-primary-darker: #5a4189;
      --color-text: #453a6b;
      --color-text-muted: #6c5f93;
      --color-bg: #fffaf5;
      --color-bg-alt: #f2ece4;
      --color-border: #ece3d8;
      --color-border-strong: #d9cdbe;
      --color-danger: #a13a3a;
      --shadow-sm: 0 1px 3px rgba(90, 65, 137, 0.08);
      --shadow-md: 0 6px 20px rgba(90, 65, 137, 0.12);
      --radius-sm: 0.4rem;
      --radius-md: 0.75rem;
      --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--color-bg-alt);
      color: var(--color-text);
      margin: 0;
      padding: 2rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid var(--color-primary-dark);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 0;
    }

    #refresh-button {
      padding: 0.55rem 1.2rem;
      background: var(--color-primary-dark);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s var(--ease), box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
    }

    #refresh-button:hover,
    #refresh-button:focus-visible {
      background: var(--color-primary-darker);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    #refresh-button:active {
      background: var(--color-primary-darker);
      transform: translateY(0);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }

    table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
      background: var(--color-bg);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    th,
    td {
      text-align: left;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--color-border);
      font-size: 0.85rem;
      vertical-align: top;
    }

    th {
      background: var(--color-bg-alt);
      color: var(--color-primary-darker);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    tbody tr {
      transition: background 0.15s var(--ease);
    }

    tbody tr:hover {
      background: var(--color-bg-alt);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    select {
      padding: 0.4rem 0.6rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border-strong);
      font-size: 0.85rem;
      background: var(--color-bg);
      color: var(--color-text);
      cursor: pointer;
      transition: border-color 0.2s var(--ease);
    }

    select:hover,
    select:focus-visible {
      border-color: var(--color-primary);
    }

    .empty,
    .error {
      padding: 1.25rem;
      font-size: 0.9rem;
      background: var(--color-bg);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .error {
      color: var(--color-danger);
    }
  </style>
</head>
<body>
  <div class="dashboard-header">
    <h1>Tea Time Cafe — Staff Dashboard</h1>
    <button id="refresh-button" type="button">Refresh</button>
  </div>
  <div id="orders-container">Loading orders...</div>

  <script src="dashboard.js"></script>
</body>
</html>
